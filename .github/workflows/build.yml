name: Validate modular replacement
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: '**/go.sum'
      - name: Contracts and independent module boundaries
        run: |
          test -z "$(gofmt -l modules apps tools)"
          make test check linux
          python3 tools/test-independent.py --online
      - name: Compile matching BPF and experiment assets
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libelf-dev linux-headers-generic shellcheck
          make bpf
          kernel_build=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$kernel_build"
          ./bin/vhost-faultlab prepare --kernel-build-dir "$kernel_build" --output /tmp/vhost_fault.ko
          shellcheck deploy/run.sh deploy/fault.sh
      - name: Package executables (no publication)
        run: |
          docker build -f deploy/Containerfile --target agent -t vhost-agent:review .
          docker run --rm --network none vhost-agent:review help
          docker build -f deploy/Containerfile --target fault -t vhost-faultlab:review .
          docker run --rm --network none vhost-faultlab:review help
