name: Validate and publish containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Test native packages, vet, and build Linux commands
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race -count=1 ./...
          go vet ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath ./cmd/...
      - name: Compile BPF and Host module
        if: runner.os == 'Linux'
        # Compilation only: hosted CI never loads kernel hooks/modules or runs live recovery.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libbpf-dev libelf-dev gcc-12 linux-headers-generic shellcheck
          make bpf
          kernel_build=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$kernel_build"
          make -C fault-injection/host KDIR="$kernel_build" CC=gcc-12
          shellcheck deploy/run.sh deploy/fault.sh

  images:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: agent
          - target: fault
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: vhost-ci:${{ matrix.target }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Verify PR image revision and unprivileged help
        env:
          IMAGE: vhost-ci:${{ matrix.target }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          revision=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$EXPECTED_REVISION"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE" --help

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: agent
            suffix: ''
          - target: fault
            suffix: '-fault'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Check current repository and package privacy before publishing
        id: privacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          repository_info=$(gh api "repos/$REPOSITORY" --jq '[.private, .owner.type] | @tsv')
          IFS=$'\t' read -r private owner_type <<< "$repository_info"
          case "$private" in true|false) ;; *) exit 1 ;; esac
          case "$owner_type" in
            User) namespace=users ;;
            Organization) namespace=orgs ;;
            *) echo "Unsupported package owner type: $owner_type" >&2; exit 1 ;;
          esac
          package=${REPOSITORY#*/}$SUFFIX
          endpoint="$namespace/$OWNER/packages/container/${package,,}"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          if gh api --include "$endpoint" --jq .visibility > "$response"; then
            visibility=$(tail -n 1 "$response")
            case "$visibility" in public|private|internal) ;; *) exit 1 ;; esac
            echo "Current repository private=$private; package visibility=$visibility"
            if [ "$private" = true ]; then test "$visibility" = private; fi
          else
            status=$(awk '/^HTTP\/[0-9.]+ / {print $2; exit}' "$response")
            if [ "$status" != 404 ]; then cat "$response" >&2; exit 1; fi
            echo "Package does not exist yet; verify visibility after first publication."
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: deploy/Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Verify published digest, revision, unprivileged help, and current privacy
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PACKAGE_ENDPOINT: ${{ steps.privacy.outputs.endpoint }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          revision=$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$EXPECTED_REVISION"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE@$DIGEST" --help
          private=$(gh api "repos/$REPOSITORY" --jq .private)
          visibility=$(gh api "$PACKAGE_ENDPOINT" --jq .visibility)
          case "$visibility" in public|private|internal) ;; *) exit 1 ;; esac
          echo "Current repository private=$private; package visibility=$visibility"
          case "$private" in
            true) test "$visibility" = private ;;
            false) ;;
            *) exit 1 ;;
          esac
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
